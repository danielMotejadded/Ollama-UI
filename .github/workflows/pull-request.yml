name: Pull Request Pipeline

on: 
  pull_request::
    branches:
        -main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  models: read

  jobs:
    validate:
      name: validate application
      runs-on: ubuntu-latest

      steps: 
        - name: Checkout repository
          uses: actions/setup-node@v-4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
          
        - name: Install dependencies
          run: npm ci
        
        - name: Run lint 
